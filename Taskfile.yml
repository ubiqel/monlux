# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  deps:
    desc: Verify, tidy and install dependencies.
    cmds:
      - go mod verify
      - go mod tidy
      - go mod vendor

  format:
    desc: Run formatters on code.
    cmds:
      - gofumpt --extra -w ./

  lint:
    desc: Lint Go code.
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run tests with the race detector.
    cmds:
      - go test -race ./...

  run.debug:
    desc: Compile and run current version of program with debug flag.
    cmds:
      - go run ./cmd --debug {{ .CLI_ARGS }}

  build.debug:
    desc: Build debug version of binary.
    cmds:
      - go build -gcflags="all=-N -l" -o ./build/shine ./cmd/*.go
