# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  deps:
    desc: Verify, tidy and install dependencies.
    cmds:
      - go mod verify
      - go mod tidy
      - go mod vendor

  format:
    desc: Run formatters on code.
    cmds:
      - gofumpt --extra -w ./

  lint:
    desc: Lint Go code.
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run tests with the race detector.
    cmds:
      - gotestsum --  -race ./...

  run.debug:
    desc: Compile and run current version of program with debug flag.
    cmds:
      - go run ./cmd/monlux --debug {{ .CLI_ARGS }}

  build.debug:
    desc: Build debug version of binary.
    cmds:
      - CGO_ENABLED=0 go build -gcflags="all=-N -l" -o ./build/monlux ./cmd/monlux

  build.release:
    desc: Build debug version of binary.
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ./build/monlux ./cmd/monlux

  release.snapshot:
    desc: Build release artifacts locally without publishing.
    cmds:
      - goreleaser release --snapshot --clean
