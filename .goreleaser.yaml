version: 2

before:
  hooks:
    - go mod verify

builds:
  - id: monlux
    main: ./cmd/monlux
    binary: monlux
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ubiqel/monlux/internal/version.Version={{ .Version }}
      - -X github.com/ubiqel/monlux/internal/version.Commit={{ .FullCommit }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: monlux
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  abbrev: 7
  format: "{{ .Message }} ({{ .SHA }})"
  filters:
    exclude:
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: ubiqel
    name: monlux
  draft: false
  prerelease: auto
